<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f0f17"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="termBg" x1="140" y1="120" x2="760" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#16161e"/>
      <stop offset="100%" stop-color="#1c1c28"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="0" x2="0" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="60" y1="0" x2="60" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="120" y1="0" x2="120" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="180" y1="0" x2="180" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="240" y1="0" x2="240" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="360" y1="0" x2="360" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="420" y1="0" x2="420" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="480" y1="0" x2="480" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="540" y1="0" x2="540" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="660" y1="0" x2="660" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="720" y1="0" x2="720" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="780" y1="0" x2="780" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="840" y1="0" x2="840" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="960" y1="0" x2="960" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="1020" y1="0" x2="1020" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="1080" y1="0" x2="1080" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="1140" y1="0" x2="1140" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="1200" y1="0" x2="1200" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="60" x2="1200" y2="60" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="120" x2="1200" y2="120" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="360" x2="1200" y2="360" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="420" x2="1200" y2="420" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="480" x2="1200" y2="480" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="540" x2="1200" y2="540" stroke="#fff" stroke-width="1"/>
  </g>

  <!-- Terminal window -->
  <g filter="url(#shadow)">
    <!-- Terminal frame -->
    <rect x="100" y="90" width="680" height="450" rx="12" fill="url(#termBg)" stroke="#2a2a3e" stroke-width="1"/>

    <!-- Title bar -->
    <rect x="100" y="90" width="680" height="40" rx="12" fill="#1e1e2e"/>
    <rect x="100" y="118" width="680" height="12" fill="#1e1e2e"/>

    <!-- Traffic lights -->
    <circle cx="128" cy="110" r="6" fill="#ff5f57"/>
    <circle cx="150" cy="110" r="6" fill="#febc2e"/>
    <circle cx="172" cy="110" r="6" fill="#28c840"/>

    <!-- Title bar text -->
    <text x="440" y="115" font-family="SF Mono, Menlo, monospace" font-size="13" fill="#666" text-anchor="middle">generate.py</text>

    <!-- Terminal content -->
    <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="14">
      <!-- Command -->
      <text x="130" y="165" fill="#6ee7b7">$</text>
      <text x="148" y="165" fill="#e2e8f0">python3 generate.py</text>

      <!-- Output line 1 -->
      <text x="130" y="205" fill="#22d3ee">[work]</text>
      <text x="232" y="205" fill="#f8fafc" font-weight="bold">admin-web</text>
      <text x="130" y="225" fill="#94a3b8">  commits </text>
      <text x="220" y="225" fill="#6ee7b7">4</text>
      <text x="240" y="225" fill="#94a3b8"> staged </text>
      <text x="310" y="225" fill="#fbbf24">0</text>
      <text x="330" y="225" fill="#94a3b8"> unstaged </text>
      <text x="420" y="225" fill="#fbbf24">0</text>

      <!-- Output line 2 -->
      <text x="130" y="265" fill="#22d3ee">[personal]</text>
      <text x="260" y="265" fill="#f8fafc" font-weight="bold">api-server</text>
      <text x="130" y="285" fill="#94a3b8">  commits </text>
      <text x="220" y="285" fill="#6ee7b7">2</text>
      <text x="240" y="285" fill="#94a3b8"> staged </text>
      <text x="310" y="285" fill="#fbbf24">1</text>
      <text x="330" y="285" fill="#94a3b8"> unstaged </text>
      <text x="420" y="285" fill="#fbbf24">3</text>

      <!-- Success message -->
      <text x="130" y="330" fill="#6ee7b7" filter="url(#glow)">2 projects reported</text>
      <text x="312" y="330" fill="#64748b">(2026-03-18)</text>

      <!-- Divider -->
      <line x1="130" y1="350" x2="750" y2="350" stroke="#2a2a3e" stroke-width="1"/>

      <!-- Analysis command -->
      <text x="130" y="380" fill="#6ee7b7">$</text>
      <text x="148" y="380" fill="#e2e8f0">/analyze</text>

      <!-- Analysis output -->
      <text x="130" y="415" fill="#a78bfa">analyzing diffs...</text>
      <text x="130" y="440" fill="#6ee7b7">claude-analysis.md</text>
      <text x="310" y="440" fill="#64748b">saved</text>

      <!-- Telegram -->
      <text x="130" y="475" fill="#22d3ee">[telegram]</text>
      <text x="232" y="475" fill="#6ee7b7">sent</text>
      <text x="270" y="475" fill="#64748b">(3 messages)</text>

      <!-- Cursor -->
      <text x="130" y="510" fill="#6ee7b7">$</text>
      <rect x="148" y="498" width="9" height="16" fill="#6ee7b7" opacity="0.8">
        <animate attributeName="opacity" values="0.8;0;0.8" dur="1.2s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Right side: concept text -->
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <!-- Title -->
    <text x="860" y="200" font-size="40" font-weight="700" fill="#f8fafc">Daily</text>
    <text x="860" y="250" font-size="40" font-weight="700" fill="#f8fafc">Code Learn</text>

    <!-- Accent line -->
    <rect x="860" y="270" width="60" height="3" rx="1.5" fill="#6ee7b7"/>

    <!-- Subtitle -->
    <text x="860" y="310" font-size="16" fill="#94a3b8">git diff</text>
    <text x="920" y="310" font-size="16" fill="#64748b"> &#8594; </text>
    <text x="955" y="310" font-size="16" fill="#94a3b8">markdown</text>
    <text x="1048" y="310" font-size="16" fill="#64748b"> &#8594; </text>
    <text x="1083" y="310" font-size="16" fill="#94a3b8">learn</text>

    <!-- Tags -->
    <rect x="860" y="345" width="78" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="899" y="364" font-size="12" fill="#6ee7b7" text-anchor="middle">Python</text>

    <rect x="948" y="345" width="62" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="979" y="364" font-size="12" fill="#22d3ee" text-anchor="middle">CLI</text>

    <rect x="1020" y="345" width="62" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="1051" y="364" font-size="12" fill="#a78bfa" text-anchor="middle">LLM</text>

    <!-- Description -->
    <text x="860" y="420" font-size="15" fill="#64748b">AI-Native 시대,</text>
    <text x="860" y="444" font-size="15" fill="#64748b">하루를 그냥 흘려보내지 않기 위한</text>
    <text x="860" y="468" font-size="15" fill="#64748b">개인용 학습 도구</text>
  </g>
</svg>
